seed: 42
n_dev: 50
n_test: 300

paths:
  data_dir: data
  chroma_dir: chroma
  cache_dir: .cache
  results_dir: results

provider:
  # All models are served through OpenRouter with one key.
  api_key_env: OPENROUTER_API_KEY
  base_url: https://openrouter.ai/api/v1      # OpenAI-compatible: chat completions + embeddings
  jev_base_url: https://openrouter.ai/api     # TypeSafe SDK appends /v1/systemone
  app_title: ragcmp

embedding:
  model: openai/text-embedding-3-small
  batch_size: 256

retrieval:
  collection: hotpot_pool
  top_k: 30

rerank:
  final_k: 5
  bge:
    model: BAAI/bge-reranker-base
    batch_size: 32
    max_length: 512
  jev:
    model: typesafe/jev-1.14   # pinned for reproducibility (~typesafe/jev-latest floats)
    instructions: >-
      Does `passages[{i}]` contain information needed to answer `query`,
      either directly or as a bridge fact that leads to the answer?

generation:
  model: openai/gpt-6-luna
  reasoning_effort: none
  max_output_tokens: 64
  max_rpm: 18          # OpenRouter new-account limit is 20 req/min on this model; raise if lifted
  max_retries: 6
  retry_wait_s: 15
  # USD per 1M tokens; fallback estimate only (OpenRouter's usage.cost is used when present)
  price_in: 0.10
  price_out: 0.50

pricing:
  embedding_per_m: 0.02
  jev_per_m: 0.042
